[env]
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    ${libraries.aploembed}
    ${libraries.miningembed}
build_flags =
    -DAPLO_RPC_SERIAL_LOGS=0

[esp32]
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
board_build.partitions = ${partitions.layout4}

[env:esp32dev]
extends = esp32
board = esp32dev
platform_packages =
    ${esp32.platform_packages}
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5

[env:esp32-c3-devkitm-1]
extends = esp32
board = esp32-c3-devkitm-1
platform_packages =
    ${esp32.platform_packages}
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
; UART0 and native USB Serial/JTAG use the same provisioning protocol.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[env:esp32-wroom-32u]
extends = env:esp32dev
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
upload_speed = 115200

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119

[env:esp32-s3-n16r8]
extends = esp32
board = esp32-s3-devkitc-1
platform_packages =
    ${esp32.platform_packages}
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
; N16R8: quad flash and octal PSRAM at 3.3 V. Console is UART0.
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = ${partitions.layout16}
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
