[platformio]
default_envs = lite-esp32-1m

[env:lite-esp32-1m]
extra_scripts = pre:build_metadata.py
framework = arduino
platform = espressif32@6.12.0
board = esp32dev
board_build.partitions = aplo-lite-1mb.csv
board_upload.flash_size = 1MB
board_upload.maximum_size = 978944
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#cd26c5b737193b85dcdbaef605a61c05c0079be0
    https://github.com/AploCoin/MiningEmbed.git#489dee13f8483459351f9af7872f0e77e891d2e8
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DAPLO_RPC_SERIAL_LOGS=0
    -DUSE_PRECOMPUTED_CP=0
    -DAPLO_RPC_ESP32_PROGRESS_WORKER=0

[release]
edition = lite
supported = true
hardware_status = experimental
chip = ESP32
serial_types = uart
flash_bytes = 0x100000
bootloader_offset = 0x1000
storage_offset = 0xff000
storage_size = 0x1000
storage_schema = 1
layout = esp32-1m-lite-latch-v1
static_ram_budget = 65536
