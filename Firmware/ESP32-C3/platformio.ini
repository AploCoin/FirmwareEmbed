[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#1f7500a24bef629f6068222a481bfbac6ac579ea
    https://github.com/AploCoin/MiningEmbed.git#cce17374665378437e22d152d7c57d0d8360ed38
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
    espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
board_build.partitions = aplo-4mb.csv
board = esp32-c3-devkitm-1
build_flags =
    -DAPLO_RPC_SERIAL_LOGS=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[release]
chip = ESP32-C3
serial_types = uart, cdc
flash_mib = 4
bootloader_offset = 0
storage_offset = 0x290000
storage_size = 0x10000
