[platformio]
default_envs = esp32dev

[env]

extra_scripts = pre:build_metadata.py
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git
    https://github.com/AploCoin/MiningEmbed.git
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
board_build.partitions = aplo-4mb.csv
board = esp32dev
build_flags =
    -DAPLO_RPC_SERIAL_LOGS=0

[env:esp32dev]

[env:esp32dev-2m]
board_build.partitions = aplo-2mb.csv
board_upload.flash_size = 2MB
board_upload.maximum_size = 1572864

; Diagnostic only: full TLS/mining application exceeds this factory slot.
[env:esp32dev-1m]
board_build.partitions = aplo-1mb-unsupported.csv
board_upload.flash_size = 1MB
board_upload.maximum_size = 851968

[release]
chip = ESP32
serial_types = uart
flash_bytes = 0x400000
bootloader_offset = 0x1000
storage_offset = 0x290000
storage_size = 0x10000

layout = esp32-4m-factory-v2

[release:esp32dev-2m]
flash_bytes = 0x200000
storage_offset = 0x190000
storage_size = 0x10000
layout = esp32-2m-factory-v2

[release:esp32dev-1m]
flash_bytes = 0x100000
storage_offset = 0xe0000
storage_size = 0x10000
layout = esp32-1m-unsupported
supported = false
