[platformio]
default_envs = esp12e

[env:esp12e]
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#1f7500a24bef629f6068222a481bfbac6ac579ea
    https://github.com/AploCoin/MiningEmbed.git#cce17374665378437e22d152d7c57d0d8360ed38
platform = espressif8266@4.2.1
board = esp12e
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
build_flags =
    -DAPLO_RPC_SERIAL_LOGS=0

[release]
chip = ESP8266
serial_types = uart
flash_mib = 4
bootloader_offset = 0
storage_offset = 0x300000
storage_size = 0xfa000
layout = esp8266-4m1m-littlefs-v1
static_ram_budget = 43008
