[platformio]
default_envs = esp12e

[env]
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#07a0cd2acc1199bd24474ef87f021fdd315d3576
    https://github.com/AploCoin/MiningEmbed.git#0ad4e868c6c352774064b1ccf28f14a15f6c22e6

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
extra_scripts = pre:bearssl_stack.py
; 160 MHz shortens BearSSL verification. bearssl_stack.py grows the loop
; stack and the BearSSL side stack so the watchdog interrupt fits.
board_build.f_cpu = 160000000L
