[platformio]
default_envs = esp12e

[env]
extra_scripts = pre:build_metadata.py
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#cd26c5b737193b85dcdbaef605a61c05c0079be0
    https://github.com/AploCoin/MiningEmbed.git#489dee13f8483459351f9af7872f0e77e891d2e8
platform = espressif8266@4.2.1
board = esp12e
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
build_flags =
    -DAPLO_RPC_SERIAL_LOGS=0

[env:esp12e]

[env:esp8266-2m]
board = esp_wroom_02
board_build.ldscript = eagle.flash.2m128.ld
board_upload.flash_size = 2MB

[env:esp01-1m]
board = esp01_1m
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m128.ld
board_upload.flash_size = 1MB

; Diagnostic only: a full TLS/mining application plus persistent storage cannot fit.
[env:esp01-512k]
board = esp01
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.512k64.ld
board_upload.flash_size = 512KB

[release]
chip = ESP8266
serial_types = uart
flash_bytes = 0x400000
bootloader_offset = 0
storage_offset = 0x300000
storage_size = 0xfa000
layout = esp8266-4m1m-littlefs-v1
static_ram_budget = 43008

[release:esp8266-2m]
flash_bytes = 0x200000
storage_offset = 0x1e0000
storage_size = 0x1b000
layout = esp8266-2m128-littlefs-v2

[release:esp01-1m]
flash_bytes = 0x100000
storage_offset = 0xdb000
storage_size = 0x20000
layout = esp8266-1m128-littlefs-v2

[release:esp01-512k]
flash_bytes = 0x80000
storage_offset = 0x6b000
storage_size = 0x10000
layout = esp8266-512k64-unsupported
supported = false
