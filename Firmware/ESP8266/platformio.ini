[platformio]
src_dir = src
default_envs = esp12e
extra_configs = platformio.local.ini

; Empty defaults let the pre-build guard explain missing local setup.
[local]
lib_deps =

[firmware]
build_flags =

[env]
framework = arduino
build_flags = ${firmware.build_flags}
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
extra_scripts =
    pre:scripts/check_dependencies.py
    pre:scripts/trust_profile.py
; Run scripts/configure_dependencies.py to generate local paths.
lib_deps = ${local.lib_deps}

[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
