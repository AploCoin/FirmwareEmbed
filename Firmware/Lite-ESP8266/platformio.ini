[platformio]
default_envs = lite-esp8266-512k

[env:lite-esp8266-512k]
extra_scripts = pre:build_metadata.py
framework = arduino
platform = espressif8266@4.2.1
board = esp01
board_build.f_cpu = 160000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.512k.ld
board_upload.flash_size = 512KB
board_upload.maximum_size = 499696
platform_packages =
    platformio/framework-arduinoespressif8266@3.30102.0
    platformio/toolchain-xtensa@2.100300.220621
    platformio/tool-esptool@1.413.0
    platformio/tool-esptoolpy@1.30000.201119
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#cd26c5b737193b85dcdbaef605a61c05c0079be0
    https://github.com/AploCoin/MiningEmbed.git#489dee13f8483459351f9af7872f0e77e891d2e8
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DAPLO_RPC_SERIAL_LOGS=0

[release]
edition = lite
supported = true
hardware_status = experimental
chip = ESP8266
serial_types = uart
flash_bytes = 0x80000
bootloader_offset = 0
storage_offset = 0x7b000
storage_size = 0x1000
storage_schema = 1
layout = esp8266-512k-lite-latch-v1
static_ram_budget = 43008
