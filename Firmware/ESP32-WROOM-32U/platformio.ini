[platformio]
src_dir = src
default_envs = esp32-wroom-32u
extra_configs = platformio.local.ini

; Empty defaults let the pre-build guard explain missing local setup.
[local]
lib_deps =

[firmware]
build_flags =

[env]
framework = arduino
build_flags = ${firmware.build_flags}
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
extra_scripts =
    pre:scripts/check_dependencies.py
    pre:scripts/trust_profile.py
; Run scripts/configure_dependencies.py to generate local paths.
lib_deps = ${local.lib_deps}

[env:esp32-wroom-32u]
platform = espressif32@6.12.0
board = esp32dev
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 4MB
upload_speed = 115200
