[platformio]
default_envs = esp32-s3-n16r8

[env]
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#9dc28d782999a9f50c67cffc1b5d0645fc67df6a
    https://github.com/AploCoin/MiningEmbed.git#0ad4e868c6c352774064b1ccf28f14a15f6c22e6

[env:esp32-s3-n16r8]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.40900.250804
; N16R8: 16 MB quad flash and 8 MB octal PSRAM at 3.3 V. Console is UART0.
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
