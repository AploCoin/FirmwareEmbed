[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
extra_scripts = pre:build_metadata.py
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_ldf_mode = deep+
lib_deps =
    https://github.com/AploCoin/AploEmbed.git#01b5a77fb54086dc88881748efba1a3ccd0861d6
    https://github.com/AploCoin/MiningEmbed.git#117a3c6377558a0f878ff7cec016fa7d4c1e1f89
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    platformio/tool-esptoolpy@2.40900.250804
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
board_build.partitions = aplo-16mb.csv
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
upload_speed = 460800
build_flags =
    -DAPLO_RPC_SERIAL_LOGS=0
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0

[release]
chip = ESP32-S3
serial_types = uart
flash_bytes = 0x1000000
bootloader_offset = 0
storage_offset = 0xc90000
storage_size = 0x10000

layout = esp32-s3-16m-factory-v2
