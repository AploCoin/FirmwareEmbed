name: Firmware builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FirmwareEmbed
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      OPENSSL_PREFIX: /usr
      MBEDTLS_PREFIX: /usr
    steps:
      - uses: actions/checkout@v4
        with:
          path: FirmwareEmbed
      - name: Check out the pinned libraries
        shell: bash
        run: |
          for library in AploEmbed MiningEmbed; do
            pin="$(sed -n "s|^[a-z]* = https://github.com/AploCoin/${library}\.git#\([0-9a-f]*\)$|\1|p" libraries.ini)"
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
            target="$GITHUB_WORKSPACE/$library"
            git init -q "$target"
            git -C "$target" fetch -q --depth=1 "https://github.com/AploCoin/$library.git" "$pin"
            git -C "$target" checkout -q --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$pin"
          done
      - name: Install TLS test headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libmbedtls-dev
      - name: SDK and mining regressions
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/AploEmbed/tests/run_native.py"
          python3 "$GITHUB_WORKSPACE/AploEmbed/tests/test_tls_trust.py" --quiet
          python3 "$GITHUB_WORKSPACE/MiningEmbed/tests/run.py" --aploembed "$GITHUB_WORKSPACE/AploEmbed"
      - name: Provisioning and storage regressions
        run: python3 tests/storage/run.py

  boards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-c3-devkitm-1, esp32-wroom-32u, esp12e, esp32-s3-n16r8]
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - name: Build and check flash and static RAM
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
        run: |
          pio run -e "$BOARD" | tee "$RUNNER_TEMP/build.log"
          python3 scripts/artifacts.py stage "$BOARD" \
            --build ".pio/build/$BOARD" --log "$RUNNER_TEMP/build.log" \
            --packages "$HOME/.platformio/packages" --output "$RUNNER_TEMP/$BOARD"
      - uses: actions/upload-artifact@v4
        with:
          name: board-${{ matrix.board }}
          path: ${{ runner.temp }}/${{ matrix.board }}
          if-no-files-found: error

  artifacts:
    runs-on: ubuntu-latest
    needs: [native, boards]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: board-*
          path: staged
      - name: Generate the release manifest and checksums
        shell: bash
        run: |
          for directory in staged/board-*; do mv "$directory" "staged/${directory#staged/board-}"; done
          version="git-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
            version="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/artifacts.py assemble --staged staged --output release --version "$version"
          (cd release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: FirmwareEmbed
          path: release
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FirmwareEmbed
          path: release
      - name: Publish the verified tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
