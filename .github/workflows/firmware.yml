name: Firmware builds

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projects:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.matrix.outputs.boards }}
      diagnostics: ${{ steps.matrix.outputs.diagnostics }}
      sdk: ${{ steps.matrix.outputs.sdk }}
      mining: ${{ steps.matrix.outputs.mining }}
      version: ${{ steps.matrix.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Discover standalone projects and locked dependency revisions
        id: matrix
        shell: bash
        run: |
          boards="$(python3 scripts/artifacts.py matrix --projects Firmware)"
          diagnostics="$(python3 scripts/artifacts.py matrix --projects Firmware --diagnostic)"
          sdk="$(python3 -c 'import json; print(json.load(open("dependencies.lock.json"))["AploEmbed"])')"
          mining="$(python3 -c 'import json; print(json.load(open("dependencies.lock.json"))["MiningEmbed"])')"
          version="git-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
            version="${GITHUB_REF_NAME#v}"
          fi
          [[ "$sdk" =~ ^[0-9a-f]{40}$ && "$mining" =~ ^[0-9a-f]{40}$ ]]
          printf 'boards=%s\ndiagnostics=%s\nsdk=%s\nmining=%s\nversion=%s\n' "$boards" "$diagnostics" "$sdk" "$mining" "$version" >> "$GITHUB_OUTPUT"

  native:
    runs-on: ubuntu-latest
    needs: projects
    defaults:
      run:
        working-directory: FirmwareEmbed
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      OPENSSL_PREFIX: /usr
      MBEDTLS_PREFIX: /usr
      SDK_SHA: ${{ needs.projects.outputs.sdk }}
      MINING_SHA: ${{ needs.projects.outputs.mining }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: FirmwareEmbed
      - name: Check out the resolved libraries
        shell: bash
        run: |
          for library in AploEmbed MiningEmbed; do
            if [[ "$library" == AploEmbed ]]; then pin="$SDK_SHA"; else pin="$MINING_SHA"; fi
            [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
            target="$GITHUB_WORKSPACE/$library"
            git init -q "$target"
            git -C "$target" fetch -q --depth=1 "https://github.com/AploCoin/$library.git" "$pin"
            git -C "$target" checkout -q --detach FETCH_HEAD
            test "$(git -C "$target" rev-parse HEAD)" = "$pin"
          done
      - name: Install TLS test headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libmbedtls-dev
      - name: SDK and mining regressions
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/AploEmbed/tests/run_native.py"
          python3 "$GITHUB_WORKSPACE/AploEmbed/tests/test_tls_trust.py" --quiet
          python3 "$GITHUB_WORKSPACE/MiningEmbed/tests/run.py" --aploembed "$GITHUB_WORKSPACE/AploEmbed"
      - name: Provisioning and storage regressions
        run: python3 tests/storage/run.py
      - name: Lite journal power-cut regressions
        run: |
          python3 Firmware/Lite-ESP8266/tests/run_latch.py
          python3 Firmware/Lite-ESP32/tests/run_latch.py
          python3 Firmware/Lite-ESP8266/tests/run_image_gate.py
          python3 Firmware/Lite-ESP32/tests/run_image_gate.py
      - name: Artifact and USB flasher regressions
        run: python3 tests/artifacts_test.py
      - name: Host configurator regressions
        run: python3 tests/configure_test.py
      - name: Archive the exact source trees
        shell: bash
        run: |
          bundle="$RUNNER_TEMP/sources"
          mkdir -p "$bundle"
          for repository in FirmwareEmbed AploEmbed MiningEmbed; do
            git -C "$GITHUB_WORKSPACE/$repository" archive --prefix="$repository/" HEAD | tar -xf - -C "$bundle"
          done
          tar -C "$bundle" -czf "$RUNNER_TEMP/sources.tar.gz" FirmwareEmbed AploEmbed MiningEmbed
      - uses: actions/upload-artifact@v6
        with:
          name: release-sources
          path: ${{ runner.temp }}/sources.tar.gz
          if-no-files-found: error

  boards:
    runs-on: ubuntu-latest
    needs: projects
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.projects.outputs.boards) }}
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - name: Build from an isolated board folder and check resources
        shell: bash
        env:
          BOARD: ${{ matrix.id }}
          BOARD_DIRECTORY: ${{ matrix.directory }}
          SDK_SHA: ${{ needs.projects.outputs.sdk }}
          MINING_SHA: ${{ needs.projects.outputs.mining }}
          APLO_RELEASE_VERSION: ${{ needs.projects.outputs.version }}
        run: |
          project="$RUNNER_TEMP/project"
          cp -R -- "$BOARD_DIRECTORY" "$project"
          python3 scripts/artifacts.py pin --project "$project" --lock dependencies.lock.json
          pio run -d "$project" -e "$BOARD" | tee "$RUNNER_TEMP/build.log"
          python3 scripts/artifacts.py stage --project "$BOARD_DIRECTORY" --environment "$BOARD" --version "$APLO_RELEASE_VERSION" \
            --build "$project/.pio/build/$BOARD" --log "$RUNNER_TEMP/build.log" \
            --packages "$HOME/.platformio/packages" --output "$RUNNER_TEMP/$BOARD"
      - uses: actions/upload-artifact@v6
        with:
          name: board-${{ matrix.id }}
          path: ${{ runner.temp }}/${{ matrix.id }}
          if-no-files-found: error

  limits:
    runs-on: ubuntu-latest
    needs: projects
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.projects.outputs.diagnostics) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - name: Prove excluded flash capacities cannot fit the complete firmware
        shell: bash
        env:
          BOARD: ${{ matrix.id }}
          BOARD_DIRECTORY: ${{ matrix.directory }}
          APLO_RELEASE_VERSION: ${{ needs.projects.outputs.version }}
          PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'no'
        run: |
          project="$RUNNER_TEMP/project"
          cp -R -- "$BOARD_DIRECTORY" "$project"
          python3 scripts/artifacts.py pin --project "$project" --lock dependencies.lock.json
          if pio run -d "$project" -e "$BOARD" > "$RUNNER_TEMP/limit.log" 2>&1; then
            cat "$RUNNER_TEMP/limit.log"
            echo "Diagnostic profile now fits; review its storage and resource contract before enabling it."
            exit 1
          fi
          cat "$RUNNER_TEMP/limit.log"
          python3 - "$RUNNER_TEMP/limit.log" <<'PYCODE'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          assert re.search(r"will not fit in region|region .+ overflowed|program size .+ greater than maximum allowed", log, re.I), "failure was not a proven flash-capacity overflow"
          PYCODE

  artifacts:
    runs-on: ubuntu-latest
    needs: [projects, native, boards, limits]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: board-*
          # A single match is extracted directly into the target directory.
          path: >-
            ${{ fromJSON(needs.projects.outputs.boards).include[1] && 'staged' ||
                format('staged/board-{0}', fromJSON(needs.projects.outputs.boards).include[0].id) }}
      - uses: actions/download-artifact@v7
        with:
          name: release-sources
          path: sources
      - name: Generate the release manifest and checksums
        shell: bash
        env:
          SDK_SHA: ${{ needs.projects.outputs.sdk }}
          MINING_SHA: ${{ needs.projects.outputs.mining }}
        run: |
          for directory in staged/board-*; do mv "$directory" "staged/${directory#staged/board-}"; done
          python3 scripts/artifacts.py assemble --projects Firmware --staged staged --output release \
            --version "${{ needs.projects.outputs.version }}" --lock dependencies.lock.json
          mv sources/sources.tar.gz release/sources.tar.gz
          (cd release && sha256sum sources.tar.gz >> SHA256SUMS)
          if [[ -f "docs/releases/v${{ needs.projects.outputs.version }}.md" ]]; then
            cp "docs/releases/v${{ needs.projects.outputs.version }}.md" release/RELEASE-NOTES.md
            (cd release && sha256sum RELEASE-NOTES.md >> SHA256SUMS)
          fi
          (cd release && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: FirmwareEmbed
          path: release
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: artifacts
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: FirmwareEmbed
          path: release
      - name: Publish the verified tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes=(--generate-notes)
          if [[ -f release/RELEASE-NOTES.md ]]; then
            notes=(--notes-file release/RELEASE-NOTES.md)
          fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "FirmwareEmbed $GITHUB_REF_NAME" "${notes[@]}"
